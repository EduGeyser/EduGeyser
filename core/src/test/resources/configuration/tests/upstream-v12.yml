bedrock:
  address: 0.0.0.0
  port: 19132
  webrtc-port: 19133
  transport: nethernet
  clone-remote-port: false
  signaling:
    mode: builtin
    advertise-addresses:
    - play.example.com
    stun-discovery: false
    builtin:
      https:
        certificate: ""
        private-key: ""
        password: ""
    nxs:
      token: ""
      endpoint: https://agent.warden.cloud
advanced:
  bedrock:
    broadcast-port: 0
    compression-level: 6
    haproxy-protocol-whitelisted-ips:
    - 10.0.0.0/8
    signaling-trusted-proxies: []
    webrtc-proxy-protocol-relays: []
    prefer-signaling-proxy-address: true
    use-waterdogpe-forwarding: false
    mtu: 1400
    validate-bedrock-login: true
    nethernet-debug: true
  nxs:
    assisted-joins: false
    connection-checks: true
    location: {}
    deregister-on-shutdown: false
config-version: 12
