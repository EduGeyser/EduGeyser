name: Build

# Builds and tests every push and pull request. A successful build of a push to master
# is then released by release.yml.
on:
  push:
    paths-ignore: &unbuilt
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'jitpack.yml'
      - '.forgejo/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore: *unbuilt

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A master build becomes a release, so a newer push waits for it instead of cancelling it
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # 25 for the core tests on the Java version EduGeyser targets; 27, the last, runs Gradle
          java-version: |
            25
            27

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Route download.geysermc.org through Cloudflare
        # Temporary: the DNS record points at an origin with a Cloudflare Origin CA certificate
        run: echo "104.26.14.230 download.geysermc.org" | sudo tee -a /etc/hosts

      - name: Build
        # Strict versions make indra run the core tests on Java 25 as well
        run: >-
          ./gradlew build
          -PrequireBundledExtension
          -PstrictMultireleaseVersions=true
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

      - name: Collect Jars
        run: |
          mkdir dist
          cp bootstrap/bungeecord/build/libs/EduGeyser-BungeeCord.jar \
            bootstrap/mod/fabric/build/libs/EduGeyser-Fabric.jar \
            bootstrap/mod/neoforge/build/libs/EduGeyser-NeoForge.jar \
            bootstrap/spigot/build/libs/EduGeyser-Spigot.jar \
            bootstrap/standalone/build/libs/EduGeyser-Standalone.jar \
            bootstrap/velocity/build/libs/EduGeyser-Velocity.jar \
            bootstrap/viaproxy/build/libs/EduGeyser-ViaProxy.jar \
            dist/

      - name: Upload Jars
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EduGeyser
          path: dist/*.jar
          if-no-files-found: error
