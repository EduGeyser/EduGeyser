name: Release

# Every successful build of a push to master becomes a release on GitHub and Codeberg,
# with the same tag, notes and jars. The version line is in .github/edugeyser-release.properties.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]

permissions: {}

# One release at a time, so that two runs never take the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'EduGeyser/EduGeyser'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download Jars
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: EduGeyser
          path: jars

      - name: Release
        run: bash .github/scripts/release.sh
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          JARS: jars
          GH_TOKEN: ${{ github.token }}
          CODEBERG_REPO: SendableMetatype/EduGeyser
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_RELEASE_TOKEN }}
